name: Browser E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-frozen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned browser tools
        run: |
          bun add --no-save --exact playwright@1.62.1
          git diff --exit-code -- package.json bun.lock
          bunx playwright install --with-deps chromium

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0

      - name: Start isolated Supabase
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: supabase start

      - name: Rebuild local database from migrations
        run: supabase db reset

      - name: Export isolated browser environment
        shell: bash
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a

          API="${API_URL:-${SUPABASE_URL:-}}"
          PUBLISHABLE="${ANON_KEY:-${PUBLISHABLE_KEY:-${SUPABASE_PUBLISHABLE_KEY:-}}}"
          SERVICE="${SERVICE_ROLE_KEY:-${SECRET_KEY:-${SUPABASE_SECRET_KEY:-}}}"

          test -n "$API" || { echo "Missing local Supabase URL"; exit 1; }
          test -n "$PUBLISHABLE" || { echo "Missing local Supabase publishable key"; exit 1; }
          test -n "$SERVICE" || { echo "Missing local Supabase service key"; exit 1; }

          case "$API" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "Refusing non-local Supabase URL: $API"; exit 1 ;;
          esac

          {
            echo "SUPABASE_URL=$API"
            echo "SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE"
            echo "VITE_SUPABASE_URL=$API"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE"
            echo "E2E_BASE_URL=http://127.0.0.1:4173"
            echo "NODE_ENV=production"
          } >> "$GITHUB_ENV"

      - name: Build production application
        run: bun run build

      - name: Preview Cloudflare production application
        shell: bash
        run: |
          nohup bunx wrangler@4.126.0 dev \
            --config .output/server/wrangler.json \
            --ip 127.0.0.1 \
            --port 4173 \
            --var "SUPABASE_URL:$SUPABASE_URL" \
            --var "SUPABASE_PUBLISHABLE_KEY:$SUPABASE_PUBLISHABLE_KEY" \
            > /tmp/browser-e2e-app.log 2>&1 &
          echo $! > /tmp/browser-e2e-app.pid

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 3 http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "Application failed to become ready"
          cat /tmp/browser-e2e-app.log
          exit 1

      - name: Run real browser flows
        run: node tests/browser-e2e.mjs

      - name: Collect application log
        if: always()
        run: |
          mkdir -p playwright-artifacts
          cp /tmp/browser-e2e-app.log playwright-artifacts/application.log 2>/dev/null || true

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-evidence
          if-no-files-found: warn
          retention-days: 7
          path: playwright-artifacts

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup
