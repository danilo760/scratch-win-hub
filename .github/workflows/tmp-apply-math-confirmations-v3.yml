name: Temporary Apply Math Confirmations V3

on:
  push:
    branches: [codex/confirm-math-admin-actions]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: codex/confirm-math-admin-actions

      - name: Apply targeted confirmation UI
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/patch-math.py
          python /tmp/patch-math.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changed files
        run: bunx prettier --write src/components/MathAdminPanel.tsx tests/admin-math-confirmations.e2e.mjs

      - name: Remove temporary workflow
        run: git rm .github/workflows/tmp-apply-math-confirmations-v3.yml

      - name: Commit patch and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/MathAdminPanel.tsx tests/admin-math-confirmations.e2e.mjs
          git commit -m "feat: confirm irreversible math admin actions"
          git push origin HEAD:codex/confirm-math-admin-actions
