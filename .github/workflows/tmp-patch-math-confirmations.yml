name: Temporary Math Confirmation Patch

on:
  push:
    branches: [codex/confirm-math-admin-actions]

permissions:
  contents: write

concurrency:
  group: tmp-math-confirmation-patch
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: codex/confirm-math-admin-actions

      - name: Apply targeted UI confirmation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/MathAdminPanel.tsx")
          source = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global source
              if old not in source:
                  raise SystemExit(f"Expected source block not found:\n{old}")
              source = source.replace(old, new, 1)

          replace_once(
              'import { supabase } from "@/integrations/supabase/client";\nimport { Badge } from "@/components/ui/badge";',
              '''import { supabase } from "@/integrations/supabase/client";
          import {
            AlertDialog,
            AlertDialogCancel,
            AlertDialogContent,
            AlertDialogDescription,
            AlertDialogFooter,
            AlertDialogHeader,
            AlertDialogTitle,
          } from "@/components/ui/alert-dialog";
          import { Badge } from "@/components/ui/badge";''',
          )

          replace_once(
              '  const [creating, setCreating] = useState(false);\n  const [publishing, setPublishing] = useState(false);',
              '''  const [creating, setCreating] = useState(false);
            const [publishing, setPublishing] = useState(false);
            const [publishConfirmOpen, setPublishConfirmOpen] = useState(false);''',
          )

          replace_once(
              '  const selected = data.versions.find((version) => version.id === selectedVersionId) ?? null;\n  const totalWeight = selected?.outcomes.reduce((total, outcome) => total + outcome.weight, 0) ?? 0;',
              '''  const selected = data.versions.find((version) => version.id === selectedVersionId) ?? null;
            const selectedCard = selected
              ? (data.cards.find((card) => card.id === selected.scratchcard_id) ?? null)
              : null;
            const totalWeight = selected?.outcomes.reduce((total, outcome) => total + outcome.weight, 0) ?? 0;''',
          )

          replace_once(
              '    ]);\n    toast.success("Versão publicada e bloqueada para edição.");',
              '''    ]);
              setPublishConfirmOpen(false);
              toast.success("Versão publicada e bloqueada para edição.");''',
          )

          replace_once(
              '                    onClick={publish}\n                    disabled={publishing || selected.outcomes.length === 0 || totalWeight <= 0}',
              '''                    onClick={() => setPublishConfirmOpen(true)}
                              disabled={publishing || selected.outcomes.length === 0 || totalWeight <= 0}''',
          )

          replace_once(
              '''      </Card>
            </div>
          );
          }

          function Metric''',
              '''      </Card>

              <AlertDialog
                open={publishConfirmOpen}
                onOpenChange={(open) => {
                  if (!publishing) setPublishConfirmOpen(open);
                }}
              >
                <AlertDialogContent>
                  <AlertDialogHeader>
                    <AlertDialogTitle>Publicar versão matemática?</AlertDialogTitle>
                    <AlertDialogDescription>
                      Ao confirmar, esta DRAFT se torna PUBLISHED e a versão atualmente publicada desta
                      raspadinha, se houver, passa a RETIRED. A versão publicada fica bloqueada para edição.
                    </AlertDialogDescription>
                  </AlertDialogHeader>
                  {selected && (
                    <div className="space-y-2 rounded-lg border bg-secondary/20 p-3 text-sm">
                      <strong className="block">
                        {selectedCard?.title ?? "Raspadinha"} — {selected.version_name}
                      </strong>
                      <p className="text-muted-foreground">
                        {selected.rarity_name ?? selected.rarity_slug ?? "Sem raridade"} ·{" "}
                        {selected.outcomes.length} outcome(s)
                      </p>
                      <div className="grid gap-2 sm:grid-cols-3">
                        <span>Peso total: {totalWeight.toLocaleString("pt-BR")}</span>
                        <span>Créditos esperados: {expectedPrize.toFixed(4)}</span>
                        <span>Pontos esperados: {expectedPoints.toFixed(4)}</span>
                      </div>
                    </div>
                  )}
                  <AlertDialogFooter>
                    <AlertDialogCancel disabled={publishing}>Cancelar</AlertDialogCancel>
                    <Button onClick={() => void publish()} disabled={publishing}>
                      {publishing ? (
                        <Loader2 className="size-4 animate-spin" />
                      ) : (
                        <Send className="size-4" />
                      )}{" "}
                      Confirmar publicação
                    </Button>
                  </AlertDialogFooter>
                </AlertDialogContent>
              </AlertDialog>
            </div>
          );
          }

          function Metric''',
          )

          replace_once(
              '''  const [name, setName] = useState(outcome.name);
            const [prize, setPrize] = useState(String(outcome.prize));
            const [points, setPoints] = useState(String(outcome.points));
            const [weight, setWeight] = useState(String(outcome.weight));
            const [busy, setBusy] = useState(false);
            const probability = totalWeight > 0 ? (outcome.weight / totalWeight) * 100 : 0;''',
              '''  const [name, setName] = useState(outcome.name);
            const [prize, setPrize] = useState(String(outcome.prize));
            const [points, setPoints] = useState(String(outcome.points));
            const [weight, setWeight] = useState(String(outcome.weight));
            const [busy, setBusy] = useState(false);
            const [removeConfirmOpen, setRemoveConfirmOpen] = useState(false);
            const probability = totalWeight > 0 ? (outcome.weight / totalWeight) * 100 : 0;''',
          )

          replace_once(
              '    await onChanged();\n    toast.success("Outcome removido.");',
              '''    await onChanged();
              setRemoveConfirmOpen(false);
              toast.success("Outcome removido.");''',
          )

          replace_once(
              '            onClick={remove}\n            aria-label="Remover outcome"',
              '''            onClick={() => setRemoveConfirmOpen(true)}
                        aria-label="Remover outcome"''',
          )

          replace_once(
              '  return (\n    <div className="grid gap-2 rounded-lg border p-3 md:grid-cols-[2fr_1fr_1fr_1fr_auto]">',
              '''  return (
              <>
                <div className="grid gap-2 rounded-lg border p-3 md:grid-cols-[2fr_1fr_1fr_1fr_auto]">''',
          )

          replace_once(
              '''    </div>
            );
          }

          function NewOutcome''',
              '''    </div>

                <AlertDialog
                  open={removeConfirmOpen}
                  onOpenChange={(open) => {
                    if (!busy) setRemoveConfirmOpen(open);
                  }}
                >
                  <AlertDialogContent>
                    <AlertDialogHeader>
                      <AlertDialogTitle>Remover outcome do DRAFT?</AlertDialogTitle>
                      <AlertDialogDescription>
                        Esta ação remove o outcome do rascunho e altera a composição matemática que poderá ser
                        publicada. Revise os dados antes de continuar.
                      </AlertDialogDescription>
                    </AlertDialogHeader>
                    <div className="rounded-lg border bg-secondary/20 p-3 text-sm">
                      <strong className="block">{outcome.name}</strong>
                      <p className="mt-1 text-muted-foreground">
                        Prêmio: {outcome.prize} · Pontos: {outcome.points} · Peso: {outcome.weight}
                      </p>
                    </div>
                    <AlertDialogFooter>
                      <AlertDialogCancel disabled={busy}>Cancelar</AlertDialogCancel>
                      <Button variant="destructive" onClick={() => void remove()} disabled={busy}>
                        {busy ? <Loader2 className="size-4 animate-spin" /> : <Trash2 className="size-4" />}{" "}
                        Confirmar remoção
                      </Button>
                    </AlertDialogFooter>
                  </AlertDialogContent>
                </AlertDialog>
              </>
            );
          }

          function NewOutcome''',
          )

          path.write_text(source)
          PY

      - name: Remove temporary workflow
        run: git rm .github/workflows/tmp-patch-math-confirmations.yml

      - name: Commit targeted patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/MathAdminPanel.tsx .github/workflows/tmp-patch-math-confirmations.yml
          git commit -m "feat: confirm irreversible math admin actions"
          git push origin HEAD:codex/confirm-math-admin-actions
