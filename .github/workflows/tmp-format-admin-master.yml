name: Temporary Admin Master Format

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tmp-format-admin-master.yml"
      - "src/components/AdminMasterUserControls.tsx"
      - "tests/admin-master-confirmations.e2e.mjs"

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'codex/confirm-admin-master-actions'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: codex/confirm-admin-master-actions

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changed files
        run: bunx prettier --write src/components/AdminMasterUserControls.tsx tests/admin-master-confirmations.e2e.mjs

      - name: Commit formatting only
        shell: bash
        run: |
          if git diff --quiet -- src/components/AdminMasterUserControls.tsx tests/admin-master-confirmations.e2e.mjs; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AdminMasterUserControls.tsx tests/admin-master-confirmations.e2e.mjs
          git commit -m "style: format admin master confirmation changes"
          git push origin HEAD:codex/confirm-admin-master-actions
