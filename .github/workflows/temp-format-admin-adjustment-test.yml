name: Temporary format admin adjustment test

on:
  push:
    branches:
      - codex/idempotent-admin-adjustments

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: codex/idempotent-admin-adjustments
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format and commit test only
        run: |
          bunx prettier --write tests/admin-master-adjustment-concurrency.integration.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/admin-master-adjustment-concurrency.integration.mjs
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
          else
            git commit -m "style: format admin adjustment concurrency test"
            git push origin HEAD:codex/idempotent-admin-adjustments
          fi
