name: Temporary admin adjustment v2 wiring

on:
  push:
    branches:
      - codex/idempotent-admin-adjustments

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: codex/idempotent-admin-adjustments
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Wire frontend and database integration suite
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/components/AdminMasterUserControls.tsx')
          text = path.read_text()

          old = 'import { useEffect, useState } from "react";'
          new = 'import { useEffect, useRef, useState } from "react";'
          if text.count(old) != 1:
            raise SystemExit(f'expected one React import, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''  const [reason, setReason] = useState("");
          const [busy, setBusy] = useState(false);
          '''
          new = '''  const [reason, setReason] = useState("");
          const [busy, setBusy] = useState(false);
          const requestRef = useRef<{ fingerprint: string; id: string } | null>(null);
          '''
          if text.count(old) != 1:
            raise SystemExit(f'expected one wallet state block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''    setBusy(true);
          const { error } = await supabase.rpc("admin_master_adjust_user_v1", {
            p_user_id: userId,
            p_balance_delta: balance,
            p_points_delta: points,
            p_reason: reason.trim(),
          });
          '''
          new = '''    const normalizedReason = reason.trim();
          const fingerprint = JSON.stringify({ userId, balance, points, reason: normalizedReason });
          if (!requestRef.current || requestRef.current.fingerprint !== fingerprint) {
            requestRef.current = { fingerprint, id: crypto.randomUUID() };
          }

          setBusy(true);
          const { error } = await supabase.rpc("admin_master_adjust_user_v2", {
            p_user_id: userId,
            p_client_request_id: requestRef.current.id,
            p_balance_delta: balance,
            p_points_delta: points,
            p_reason: normalizedReason,
          });
          '''
          if text.count(old) != 1:
            raise SystemExit(f'expected one v1 wallet RPC call, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''    setBalanceDelta("0");
          setPointsDelta("0");
          setReason("");
          await onChanged();
          '''
          new = '''    requestRef.current = null;
          setBalanceDelta("0");
          setPointsDelta("0");
          setReason("");
          await onChanged();
          '''
          if text.count(old) != 1:
            raise SystemExit(f'expected one wallet success reset, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)

          workflow = Path('.github/workflows/database-tests.yml')
          text = workflow.read_text()
          old = '''          node tests/store-redemption-concurrency.integration.mjs
          '''
          new = '''          node tests/store-redemption-concurrency.integration.mjs
          node tests/admin-master-adjustment-concurrency.integration.mjs
          '''
          if text.count(old) != 1:
            raise SystemExit(f'expected one database test tail, found {text.count(old)}')
          workflow.write_text(text.replace(old, new, 1))
          PY

          bunx prettier --write src/components/AdminMasterUserControls.tsx .github/workflows/database-tests.yml tests/admin-master-adjustment-concurrency.integration.mjs
          git diff --check
      - name: Generate Supabase types from migrated local schema
        shell: bash
        run: |
          supabase start
          supabase db reset
          supabase gen types typescript --local > src/integrations/supabase/types.ts
          bunx prettier --write src/integrations/supabase/types.ts
          git diff --check
      - name: Remove temporary workflow and commit result
        shell: bash
        run: |
          git rm .github/workflows/temp-admin-adjustment-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AdminMasterUserControls.tsx src/integrations/supabase/types.ts .github/workflows/database-tests.yml tests/admin-master-adjustment-concurrency.integration.mjs supabase/migrations/20260829182000_admin_master_adjustment_idempotency.sql supabase/tests/database/admin_master_adjustment_idempotency.test.sql
          git diff --cached --check
          git commit -m "feat: make admin master adjustments idempotent"
          git push origin HEAD:codex/idempotent-admin-adjustments
