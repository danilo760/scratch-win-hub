name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format
        run: |
          bunx prettier --write src/components/GameTab.tsx src/components/ScratchCard.tsx tests/rarity-effects.e2e.mjs
          git diff -- src/components/GameTab.tsx src/components/ScratchCard.tsx tests/rarity-effects.e2e.mjs
          git diff --exit-code
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun run test
      - name: Build
        run: bun run build
