name: Validate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Apply canonical formatting in runner
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Emit formatted files for remediation
        if: always()
        run: |
          for file in \
            AGENTS.md \
            src/components/AdminWorkspace.tsx \
            src/components/MathAdminPanel.tsx \
            src/integrations/supabase/auth-attacher.ts \
            src/integrations/supabase/auth-middleware.ts \
            src/integrations/supabase/client.server.ts \
            src/integrations/supabase/client.ts \
            src/integrations/supabase/previewAuthStorage.ts \
            src/integrations/supabase/types.ts \
            src/routes/_authenticated/app.tsx \
            src/routes/README.md
          do
            echo "__FORMAT_FILE__${file}"
            base64 -w0 "$file"
            echo
            echo "__END_FILE__"
          done
          git diff --exit-code
