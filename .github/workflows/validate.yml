name: Validate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Apply canonical formatting in runner
        run: |
          npm run format
          git diff > prettier.patch
      - name: Capture ESLint report
        run: npx eslint . -f json -o eslint-report.json || true
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics
          path: |
            eslint-report.json
            prettier.patch
          if-no-files-found: error
          retention-days: 1
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify formatting is committed
        if: always()
        run: git diff --exit-code
