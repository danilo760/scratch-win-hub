name: Patch Admin Math State Temp

on:
  push:
    paths:
      - ".github/workflows/patch-admin-math-state-temp.yml"

permissions:
  contents: write

jobs:
  patch-admin-math-state:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Patch AdminWorkspace safely
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/components/AdminWorkspace.tsx")
          source = path.read_text()

          def block(*lines):
              return "\n".join(lines)

          old_query = block(
              "  const { data, isLoading, error } = operationsQuery;",
              "  const { data: math = { versions: [], rarities: [] } } = useQuery({",
              "    queryKey: adminMathQueryKey,",
              "    queryFn: async () => {",
              '      const { data, error } = await supabase.rpc("get_admin_math_config_v1" as never);',
              "      if (error) throw error;",
              "      return parseMathSnapshot(data);",
              "    },",
              "  });",
          )
          new_query = block(
              "  const { data, isLoading, error } = operationsQuery;",
              "  const mathQuery = useQuery({",
              "    queryKey: adminMathQueryKey,",
              "    queryFn: async () => {",
              '      const { data, error } = await supabase.rpc("get_admin_math_config_v1" as never);',
              "      if (error) throw error;",
              "      return parseMathSnapshot(data);",
              "    },",
              "  });",
              "  const math = mathQuery.data ?? { versions: [], rarities: [] };",
          )

          old_tabs = block(
              '      <TabsContent value="outcomes">',
              "        <OutcomesPanel versions={math.versions} cards={data.scratchcards} />",
              "      </TabsContent>",
              '      <TabsContent value="rarities">',
              "        <RaritiesPanel rarities={math.rarities} />",
              "      </TabsContent>",
          )
          new_tabs = block(
              '      <TabsContent value="outcomes">',
              "        {mathQuery.error ? (",
              "          <AdminMathErrorState onRetry={() => void mathQuery.refetch()} />",
              "        ) : mathQuery.isLoading ? (",
              "          <AdminMathLoadingState />",
              "        ) : (",
              "          <OutcomesPanel versions={math.versions} cards={data.scratchcards} />",
              "        )}",
              "      </TabsContent>",
              '      <TabsContent value="rarities">',
              "        {mathQuery.error ? (",
              "          <AdminMathErrorState onRetry={() => void mathQuery.refetch()} />",
              "        ) : mathQuery.isLoading ? (",
              "          <AdminMathLoadingState />",
              "        ) : (",
              "          <RaritiesPanel rarities={math.rarities} />",
              "        )}",
              "      </TabsContent>",
          )

          old_simulator = block(
              '      <TabsContent value="simulator">',
              "        <SimulatorPanel versions={math.versions} cards={data.scratchcards} />",
              "      </TabsContent>",
          )
          new_simulator = block(
              '      <TabsContent value="simulator">',
              "        {mathQuery.error ? (",
              "          <AdminMathErrorState onRetry={() => void mathQuery.refetch()} />",
              "        ) : mathQuery.isLoading ? (",
              "          <AdminMathLoadingState />",
              "        ) : (",
              "          <SimulatorPanel versions={math.versions} cards={data.scratchcards} />",
              "        )}",
              "      </TabsContent>",
          )

          old_helper = "function AdminTrigger({ value, label }: { value: string; label: string }) {"
          new_helper = block(
              "function AdminMathLoadingState() {",
              "  return (",
              '    <Card aria-busy="true">',
              '      <CardContent className="flex min-h-40 items-center justify-center gap-2 p-6 text-sm text-muted-foreground">',
              '        <Loader2 className="size-4 animate-spin" /> Carregando configuração matemática…',
              "      </CardContent>",
              "    </Card>",
              "  );",
              "}",
              "",
              "function AdminMathErrorState({ onRetry }: { onRetry: () => void }) {",
              "  return (",
              "    <Card>",
              '      <CardContent className="space-y-3 p-6">',
              '        <p role="alert" className="text-destructive">',
              "          Não foi possível carregar a configuração matemática.",
              "        </p>",
              '        <Button variant="outline" onClick={onRetry}>',
              '          <RefreshCw className="size-4" /> Tentar novamente',
              "        </Button>",
              "      </CardContent>",
              "    </Card>",
              "  );",
              "}",
              "",
              old_helper,
          )

          replacements = [
              (old_query, new_query, "math query"),
              (old_tabs, new_tabs, "outcomes/rarities tabs"),
              (old_simulator, new_simulator, "simulator tab"),
              (old_helper, new_helper, "math state helpers"),
          ]

          for old, new, label in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label} match, found {count}")
              source = source.replace(old, new, 1)

          path.write_text(source)
      - name: Format target
        run: npx prettier --write src/components/AdminWorkspace.tsx
      - name: Verify target formatting
        run: npx prettier --check src/components/AdminWorkspace.tsx
      - name: Validate patch
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AdminWorkspace.tsx
          git diff --cached --check
          git commit -m "fix: surface admin math config failures"
          git push origin HEAD:main
